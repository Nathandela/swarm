name: CI

on:
  # No `tags:` filter: release.yml's own `push: tags: [v*]` trigger calls this workflow via
  # workflow_call, so a bare push trigger here would run the whole matrix a second time,
  # redundantly, for every tag push. `branches: ['**']` keeps every branch push triggering
  # (unchanged behavior) while a tag-only push no longer double-fires this workflow.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

# ADR-008. GOTOOLCHAIN defaults to `auto`, which is why the previous `go-version: '1.24'`
# pins never failed against a go.mod declaring 1.25.0: Go silently downloaded 1.25 and built
# anyway, so every job reported success while naming a toolchain nothing was built with.
# `local` turns a floor/pin mismatch into a hard error instead of letting the pin self-heal
# into a lie.
env:
  GOTOOLCHAIN: local

jobs:
  docs:
    name: docs (required files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required documentation files exist
        run: |
          for f in AGENTS.md docs/INDEX.md docs/governance/PROVENANCE.md; do
            if [ ! -f "$f" ]; then
              echo "missing required file: $f"
              exit 1
            fi
          done
      # PB-DOC-7: every concrete PB-* id owned exactly once, no wildcard ownership, every
      # dependency edge enumerated, the slice DAG acyclic and orphan-free, and section 11's
      # readable table not contradicting either authoritative file. The requirement asks for
      # this "validated in CI" specifically: ownership-in-prose failed three audit rounds
      # running, and the checker existed for two more without anything running it on push.
      # --strict-section11 IS ARMED HERE, and the reason is the paragraph above happening a
      # second time one level down. Strict mode was built, and internal/verify's
      # phaseb_manifest_test.go mutation-proves it has teeth -- then nothing ran it on push.
      # So section 11's readable rows drifted for two days (S8 lost PB-SAS-4, S21 lost the
      # re-scoped PB-E2E-2), an external reviewer found it by hand, and the S20 evidence file
      # went on claiming "default AND --strict-section11: both exit 0" -- true when written.
      # A mode nothing runs is not a check, however well it is tested (ADR-007 B97).
      - name: Phase B slice-ownership manifest (PB-DOC-7)
        run: python3 scripts/check-phaseb-manifest.py --strict-section11

  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # EXACT pin, not '1.25': staticcheck's stdlib facts must come from the
          # same toolchain the module pins (go.mod:3). When the runners rolled
          # forward to go1.25.14 on 2026-09-01, v2.12.2 under the floating spec
          # began emitting SA5011 false positives on t.Fatal-guarded nil checks
          # (t.Fatal's noreturn fact was lost) and failed every branch; the same
          # linter against go1.25.0 is clean. Bump this together with go.mod.
          go-version: '1.25.0'
      - name: Run golangci-lint
        # v2.12.2: the golangci-lint release pinned to `go 1.25.0` (go.mod:3, ADR-008).
        # v1.64's binary was built with go1.24.1, which refuses to run at all against a
        # go 1.25.0 module ("the Go language version used to build golangci-lint is
        # lower than the targeted Go version") -- exit 3 before any linter runs.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    name: test (go test ./...)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # mobile/bind_test.go (PB-BIND-2) shells out to the real gobind binary and
      # t.Fatalf's if it is not on PATH or in $GOPATH/bin -- there is no skip path.
      # Installed exactly as the "android" job does: same pin (android/toolchain.env),
      # same two `go install` commands.
      - name: Install the pinned gomobile and gobind
        run: |
          . android/toolchain.env
          go install "golang.org/x/mobile/cmd/gomobile@$SWARM_GOMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$SWARM_GOMOBILE_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Vet (GG-4)
        run: go vet ./...
      - name: Run tests
        run: go test -race ./...
      # E10.6: exercise the REAL linux CPU sampler (/proc) against live processes.
      # The parser UNIT tests run above (untagged); this covers the syscall path.
      - name: CPU sampler integration (E10.6, linux /proc)
        run: go test -tags integration -race ./internal/engine/
      # E14.4 (N-3, scenario 15): the real daemon + shims idle-CPU soak, in the same
      # `-tags integration` lane. Scoped by -run to the single >=60s soak so it does
      # not re-run the whole daemon suite (already run untagged under `go test -race
      # ./...` above). Non-race on purpose: the sampled daemon is a re-exec of this
      # test binary, so an uninstrumented build measures a faithful idle CPU.
      - name: Daemon idle-CPU soak (E14.4, N-3, scenario 15)
        run: go test -tags integration -run '^TestDaemonIdleCPUNearZero$' -count=1 ./internal/daemon/
      # E14.4 (N-1): the real-daemon first-paint p95 gate. NON-race on purpose —
      # the TUI client is goroutine/channel-heavy so -race inflates first-paint
      # ~25x (a 2s sanity ceiling is asserted under -race by `go test -race ./...`
      # above); an uninstrumented build asserts the authoritative <100ms p95 @50.
      - name: TUI first-paint p95 gate (E14.4, N-1)
        run: go test -run '^TestFirstPaintGate_RealDaemon_FiftySessions_P95$' -count=1 ./internal/tui/
      # E14.4 (N-2): the live-shim keystroke->PTY echo p95 gate. Same non-race
      # rationale as N-1 — the authoritative <10ms assertion is the non-race build
      # (a 250ms sanity ceiling is asserted under -race by `go test -race ./...`).
      - name: Live-shim keystroke echo p95 gate (E14.4, N-2)
        run: go test -run '^TestE2E_LiveShimKeystrokeEchoLatencyP95$' -count=1 ./internal/e2e/

  # These integration tests skip without their local services; ordinary go test
  # is therefore not coverage for the v2 persistence/transport boundaries.
  remote-v2:
    name: remote v2 (workerd + Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            services/relay/package-lock.json
            docs/verification/remote-scale-to-zero/push-probe/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned local-service tools
        run: |
          npm ci --prefix services/relay --no-audit --no-fund
          npm ci --prefix docs/verification/remote-scale-to-zero/push-probe --ignore-scripts --no-audit --no-fund
      - name: Native Worker, Go interoperability and SQLite cost bounds
        working-directory: services/relay
        run: npm test
      - name: Transactional push with the actual Firestore SDK
        working-directory: docs/verification/remote-scale-to-zero/push-probe
        run: |
          node run-bounded.mjs 180 ./node_modules/.bin/firebase emulators:exec \
            --only firestore --project demo-swarm-push-probe --config firebase.json \
            'cd ../../../.. && go test -race ./internal/pushgw -run TestFirestore -count=1 -timeout 120s -v'

  # E10.6: the darwin half. The pure CPU parsers run in the unit step (untagged, on
  # every runner), and the integration step exercises the REAL proc_pidinfo syscall
  # natively, so BOTH platform sampler paths are actually verified in CI.
  test-darwin:
    name: test-darwin (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Engine + hookclient unit tests (incl. darwin CPU parser)
        run: go test -race ./internal/engine/... ./internal/hookclient/...
      - name: CPU sampler integration (E10.6, darwin proc_pidinfo)
        run: go test -tags integration -race ./internal/engine/
      # E14.4 (N-3, scenario 15): the real daemon + shims idle-CPU soak on darwin
      # (proc_taskinfo path). Scoped by -run to the single >=60s soak; non-race so
      # the sampled daemon subprocess is a faithful, uninstrumented build.
      - name: Daemon idle-CPU soak (E14.4, N-3, scenario 15)
        run: go test -tags integration -run '^TestDaemonIdleCPUNearZero$' -count=1 ./internal/daemon/

  # E14.5: active fuzzing (not just the seed corpus already covered by the
  # untagged `go test` above). `-fuzz` runs exactly one target per invocation
  # and its regex must match a single Fuzz func, so each target gets its own
  # step; `-run '^$'` skips the normal tests so the step only fuzzes.
  fuzz:
    name: fuzz (active, bounded fuzztime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Fuzz FuzzRoundTrip (internal/wire)
        run: go test -run '^$' -fuzz '^FuzzRoundTrip$' -fuzztime=30s ./internal/wire
      - name: Fuzz FuzzReadFrame (internal/wire)
        run: go test -run '^$' -fuzz '^FuzzReadFrame$' -fuzztime=30s ./internal/wire
      - name: Fuzz FuzzFeedSplitConsistency (internal/vt)
        run: go test -run '^$' -fuzz '^FuzzFeedSplitConsistency$' -fuzztime=30s ./internal/vt
      - name: Fuzz FuzzExtractConversationIDTotality (internal/adapter)
        run: go test -run '^$' -fuzz '^FuzzExtractConversationIDTotality$' -fuzztime=30s ./internal/adapter
      - name: Fuzz FuzzReferenceExtractConversationIDTotality (internal/adapter/refadapter)
        run: go test -run '^$' -fuzz '^FuzzReferenceExtractConversationIDTotality$' -fuzztime=30s ./internal/adapter/refadapter

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build swarm binary (CGO_ENABLED=0)
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o swarm-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/swarm
      # E1.2 static-linking assertion runs on the linux targets only: `file` on
      # this ubuntu runner reads ELF metadata, so "statically linked" is
      # meaningful for GOOS=linux (including the cross-built arm64 ELF). Darwin
      # cross-builds produce Mach-O, which the ELF-oriented `file` here cannot
      # classify; the honest darwin check (system-libraries-only via otool) runs
      # natively in the build-darwin job below.
      - name: Assert linux binary is statically linked (E1.2)
        if: matrix.goos == 'linux'
        run: |
          file swarm-${{ matrix.goos }}-${{ matrix.goarch }}
          file swarm-${{ matrix.goos }}-${{ matrix.goarch }} | grep -q "statically linked"

  # darwin cannot be fully static (no static libSystem); E1.2 is interpreted as:
  # fully static ELF on linux, system-libraries-only on darwin.
  build-darwin:
    name: build-darwin (darwin/${{ matrix.goarch }})
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build darwin binary (CGO_ENABLED=0)
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: go build -o swarm-darwin-${{ matrix.goarch }} ./cmd/swarm
      - name: Assert darwin binary links only system libraries (E1.2)
        run: |
          otool -L swarm-darwin-${{ matrix.goarch }}
          libs=$(otool -L swarm-darwin-${{ matrix.goarch }} | tail -n +2 | awk '{print $1}')
          # Allowlist covers libSystem/libresolv plus the two Frameworks a plain
          # CGO_ENABLED=0 build legitimately links on darwin (Go's runtime and
          # crypto/x509 root-store path pull these in regardless of cgo) --
          # confirmed against a real `go build ./cmd/swarm` on darwin/arm64.
          # `[[:space:]]*` tolerates a leading-whitespace otool line either way;
          # anything else here is still a genuine E1.2 violation.
          bad=$(echo "$libs" | grep -vE '^[[:space:]]*(/usr/lib/(libSystem|libresolv)|/System/Library/Frameworks/(CoreFoundation|Security)\.framework/)' || true)
          if [ -n "$bad" ]; then
            echo "E1.2 violation: binary links non-system dylibs:"
            echo "$bad"
            exit 1
          fi

  # E13.1: the RELEASE pipeline itself (.goreleaser.yaml), as opposed to the
  # plain `go build` matrix above — a dry-run snapshot proves it produces the 3
  # artifacts (one darwin universal + two static linux) + checksums without
  # publishing anything (--skip=publish, no tag/token needed), asserts the darwin
  # artifact is a genuine Mach-O universal (fat) binary (h07), and re-asserts N-4
  # (zero runtime deps) on its actual output via both `file` and `ldd` on the
  # linux/amd64 artifact.
  release-dryrun:
    name: release dry-run (goreleaser snapshot, E13.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        # Pinned exactly (not the floating '1.24' the other jobs use): this is
        # the release pipeline, so its toolchain should be reproducible.
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Set up goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: '2.17.0' # the version verified locally for this config
      - name: Validate .goreleaser.yaml
        run: goreleaser check
      - name: Snapshot release (build + archive + checksum, no publish)
        # --skip=sign: the checksums signature (lifecycle R2) needs the release
        # secret, which PR-triggered runs must never hold; the publish job signs.
        run: goreleaser release --snapshot --clean --skip=publish --skip=sign
      - name: Assert the compatibility card ships inside the archive (lifecycle R3)
        # A regressed archives.files glob would silently degrade every wire
        # gate to "unknown" fleet-wide (R2/R3 audit, Fable M5).
        run: |
          tar -Oxzf dist/swarm_*_linux_amd64.tar.gz compat.json | grep -q '"shimwire"'
      - name: Assert 3 artifacts (darwin universal + 2 linux) + a checksums file exist (E13.1, h07)
        run: |
          count=$(find dist -maxdepth 1 -name 'swarm_*.tar.gz' | wc -l)
          echo "archives: $count"
          test "$count" -eq 3
          test -f dist/checksums.txt
          # darwin ships as a single universal (fat) archive now, not per-arch (replace: true)
          ls dist/swarm_*_darwin_all.tar.gz
      - name: Assert the darwin artifact is a Mach-O universal (fat) binary (h07)
        run: |
          bin=$(find dist -type f -name swarm -path '*darwin_all*' | head -n1)
          test -n "$bin"
          file "$bin"
          file "$bin" | grep -q "Mach-O universal binary"
      - name: Verify archives against checksums.txt (E13.1)
        working-directory: dist
        run: sha256sum -c checksums.txt
      - name: Assert linux artifacts are statically linked (N-4)
        run: |
          for arch in amd64 arm64; do
            bin=$(find dist -type f -name swarm -path "*linux_${arch}*" | head -n1)
            test -n "$bin"
            file "$bin"
            file "$bin" | grep -q "statically linked"
          done
      - name: Assert linux/amd64 artifact has zero runtime deps via ldd (N-4)
        run: |
          bin=$(find dist -type f -name swarm -path '*linux_amd64*' | head -n1)
          out=$(ldd "$bin" 2>&1 || true)
          echo "$out"
          if ! echo "$out" | grep -q "not a dynamic executable"; then
            echo "N-4 violation: ldd reports linux/amd64 binary has dynamic dependencies"
            exit 1
          fi
      - name: Verify `go install ./cmd/swarm` builds and runs (E13.3)
        run: |
          tmp=$(mktemp -d)
          GOBIN="$tmp" go install ./cmd/swarm
          "$tmp/swarm" version
          "$tmp/swarm" version | grep -q "swarm "

  # PB-TOOL-7: the Android artifacts, built somewhere other than one laptop. Every version
  # this lane installs is read from android/toolchain.env, so the pin is EXERCISED rather
  # than described -- a lane that quietly used the runner's preinstalled SDK would report
  # success for a toolchain nothing in this repository chose.
  android:
    name: android (aar + gradle gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
      - name: Install the pinned platform, build-tools and NDK
        run: |
          . android/toolchain.env
          sdkmanager --install \
            "platforms;android-$SWARM_ANDROID_COMPILE_SDK" \
            "build-tools;$SWARM_ANDROID_BUILD_TOOLS" \
            "ndk;$SWARM_ANDROID_NDK"
      # Pinned by version rather than resolved from the module, so gomobile and gobind are
      # the pair SWARM_GOMOBILE_VERSION names. gobind must be on PATH because `gomobile bind`
      # spawns it as a child process and misreports its absence as "run gomobile init".
      - name: Install the pinned gomobile and gobind
        run: |
          . android/toolchain.env
          go install "golang.org/x/mobile/cmd/gomobile@$SWARM_GOMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$SWARM_GOMOBILE_VERSION"
      - name: Build the AAR (PB-TOOL-2)
        run: ./android/build-aar.sh
      - name: Gradle gate (PB-TOOL-6)
        working-directory: android
        run: ./gradlew --no-daemon lint test
      - name: Debug APK (PB-TOOL-3)
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      # The expensive half of the gate: it inspects the real AAR for each declared ABI and
      # for absolute builder paths, runs the wrapper with the system Gradle off PATH, and
      # reads the JUnit XML to prove every checked-in Kotlin test actually ran. Behind the
      # `androidgate` tag and not invoked here would be behind a tag and never run.
      # -timeout is raised because go test defaults to 10 minutes for the whole package and
      # these assertions run two gomobile cross-compiles, four Gradle invocations and an
      # apksigner verification; their own per-command bounds already add up past that.
      - name: Android artifact assertions (go test -tags androidgate)
        run: go test -tags androidgate -timeout 60m -count=1 ./android/gate/...
