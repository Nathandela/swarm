name: pushgw-container

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  IMAGE: swarm-pushgw:ci

jobs:
  image:
    name: build, scan, non-root, hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build push gateway image
        run: docker build -f deploy/pushgw/Dockerfile -t "$IMAGE" .

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: swarm-pushgw:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: deploy/pushgw/.trivyignore

      - name: Assert non-root execution
        run: |
          user="$(docker inspect --format '{{.Config.User}}' "$IMAGE")"
          case "$user" in
            ''|0|root|0:*|root:*) exit 1 ;;
          esac

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate v2 image and operational source contract
        run: go test ./deploy/pushgw -count=1
