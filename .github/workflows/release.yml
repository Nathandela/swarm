name: Release

# Defect 4 (r0 ci-workflows RED): v0.10.0..v0.10.3 were all tagged and published while
# their own tag's CI was red -- nothing in this repo's CI or branch settings would have
# stopped it. This workflow closes that gap: it reuses ci.yml's full gate set (via
# workflow_call, so there is exactly one place the gates are defined) and only runs
# `goreleaser release` -- the real publish, not release-dryrun's --skip=publish snapshot
# -- once every one of those gates has passed.
# ADR-008 / ci.yml. GOTOOLCHAIN defaults to `auto`, under which a go-version pin that
# disagrees with go.mod's floor silently self-heals by downloading the right toolchain --
# so the build "succeeds" while naming a version nothing was actually built with. `local`
# turns that mismatch into a hard error instead. ci.yml sets this workflow-wide already;
# the publish job below is the one build that actually ships to users, so it gets the same
# guard rather than being the only build in the repo without it.
env:
  GOTOOLCHAIN: local

on:
  push:
    tags:
      - 'v*'

jobs:
  gates:
    name: gates (ci.yml, reused)
    uses: ./.github/workflows/ci.yml

  # The container lane is a publish gate too (committee round 4, codex blocker 2):
  # relay-container.yml has no tag trigger and the branch ruleset covers only
  # refs/heads/main, so without this reuse a release tag published unscanned.
  container:
    name: container (relay-container.yml, reused)
    uses: ./.github/workflows/relay-container.yml

  container_pushgw:
    name: container (pushgw-container.yml, reused)
    uses: ./.github/workflows/pushgw-container.yml

  # This is the ONLY job in the repository allowed to write packages. The PR/branch
  # container workflows above build and scan with contents:read only. Publication is
  # reachable solely from release.yml's tag trigger, after both exact Dockerfiles pass
  # their vulnerability and hardening gates.
  publish_containers:
    name: publish immutable relay + pushgw images
    needs: [gates, container, container_pushgw]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Require an exact release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ref ${GITHUB_REF_NAME} is not an exact vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi

      - name: Capture reproducible release metadata
        id: release_metadata
        shell: bash
        run: echo "date=$(git show -s --format=%cI '${GITHUB_SHA}')" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish swarm-relay
        id: relay_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # One immutable alias only. Deliberately no latest, branch, or moving major tag.
          tags: ghcr.io/nathandela/swarm-relay:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.release_metadata.outputs.date }}
          provenance: false
          sbom: true
          cache-from: type=gha,scope=release-relay
          cache-to: type=gha,mode=max,scope=release-relay

      - name: Attest swarm-relay digest
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/nathandela/swarm-relay
          subject-digest: ${{ steps.relay_image.outputs.digest }}
          push-to-registry: true

      - name: Build and publish swarm-pushgw
        id: pushgw_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pushgw/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nathandela/swarm-pushgw:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.release_metadata.outputs.date }}
          provenance: false
          sbom: true
          cache-from: type=gha,scope=release-pushgw
          cache-to: type=gha,mode=max,scope=release-pushgw

      - name: Attest swarm-pushgw digest
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/nathandela/swarm-pushgw
          subject-digest: ${{ steps.pushgw_image.outputs.digest }}
          push-to-registry: true

      - name: Write exact deployment manifest
        shell: bash
        run: |
          mkdir -p release-metadata
          printf '%s\n' \
            '{' \
            '  "schema": 1,' \
            '  "release": "${{ github.ref_name }}",' \
            '  "commit": "${{ github.sha }}",' \
            '  "images": {' \
            '    "relay": "ghcr.io/nathandela/swarm-relay@${{ steps.relay_image.outputs.digest }}",' \
            '    "pushgw": "ghcr.io/nathandela/swarm-pushgw@${{ steps.pushgw_image.outputs.digest }}"' \
            '  }' \
            '}' > release-metadata/container-images.json

      - name: Upload exact deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: container-images-${{ github.ref_name }}
          path: release-metadata/container-images.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish (goreleaser release)
    needs: [gates, container, container_pushgw, publish_containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Set up goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: '2.17.0' # matches release-dryrun (ci.yml) -- verified locally for this config
      - name: Verify the signing secret matches a compiled trust slot
        # A valid-but-wrong secret would let goreleaser publish assets every
        # fleet machine rejects (R2/R3 audit); the selfcheck fails the release
        # here instead.
        env:
          SWARM_RELEASE_SIGNING_KEY: ${{ secrets.SWARM_RELEASE_SIGNING_KEY }}
        run: go run ./scripts/signchecksums --selfcheck
      - name: Publish release (goreleaser)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT (Contents: read-write on Nathandela/homebrew-swarm only);
          # GITHUB_TOKEN cannot push the cask to a different repo. Referenced by
          # .goreleaser.yaml homebrew_casks.repository.token.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # The checksums-signing seed (lifecycle R2): base64 ed25519 seed, read
          # by scripts/signchecksums via .goreleaser.yaml signs. Absent or empty,
          # the signer refuses and the release fails -- an unsigned release is a
          # release every fleet machine would refuse to stage anyway.
          SWARM_RELEASE_SIGNING_KEY: ${{ secrets.SWARM_RELEASE_SIGNING_KEY }}
        run: goreleaser release --clean
