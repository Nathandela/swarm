version: 2

project_name: swarm

before:
  hooks:
    - go mod tidy
    # The release's compatibility card (lifecycle R3): compat.json carries the
    # wire/schema constants this build was compiled with, emitted from the same
    # source constants the binary runs on (scripts/releasemanifest reads
    # GORELEASER_CURRENT_TAG). It ships INSIDE the swarm archive, so the signed
    # checksum covers it; activation gates on it with pure disk reads.
    - go run ./scripts/releasemanifest --out compat.json

# Three deployables ship from this pipeline:
#
#   swarm         the CLI/TUI the owner drives
#   swarm-remote  the remote-control gateway sidecar, which runs under launchd or
#                 systemd on the owner's machine (PB-LIFE-6). It ships in the SAME
#                 archive as swarm on purpose: `swarm remote init` writes the gateway's
#                 absolute path into the supervision unit's ExecStart, and it looks for
#                 it BESIDE its own executable first (then PATH), so a machine that
#                 installed only swarm could not generate a unit that points at
#                 anything (PB-LIFE-1). Every packaging path that installs the archive
#                 must therefore deliver BOTH binaries -- see the homebrew_casks
#                 `binaries:` list below, which a cask does not derive on its own.
#   swarm-relay   the server-side rendezvous/mailbox relay, deployed on a host of its
#                 own and therefore archived on its own.
#
# swarm-char and swarm-fake-agent (cmd/swarm-char, cmd/swarm-fake-agent) are dev/test
# tools; the build list below is the whole release matrix.
builds:
  - id: swarm
    main: ./cmd/swarm
    binary: swarm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # N-4: CGO_ENABLED=0 + pure Go already guarantees a statically linked
    # binary with zero third-party runtime dependencies; -s -w just strips
    # debug info. ldflags stamp internal/version so `swarm version` and the
    # D-8 hello handshake (E13.2) report the real release version; the same
    # stamps are applied to every binary here, and take effect in each one
    # that links internal/version.
    ldflags:
      - -s -w
      - -X github.com/Nathandela/swarm/internal/version.Version={{ .Version }}
      - -X github.com/Nathandela/swarm/internal/version.Commit={{ .Commit }}
      - -X github.com/Nathandela/swarm/internal/version.Date={{ .Date }}

  - id: swarm-remote
    main: ./cmd/swarm-remote
    binary: swarm-remote
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Nathandela/swarm/internal/version.Version={{ .Version }}
      - -X github.com/Nathandela/swarm/internal/version.Commit={{ .Commit }}
      - -X github.com/Nathandela/swarm/internal/version.Date={{ .Date }}

  - id: swarm-relay
    main: ./cmd/swarm-relay
    binary: swarm-relay
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Nathandela/swarm/internal/version.Version={{ .Version }}
      - -X github.com/Nathandela/swarm/internal/version.Commit={{ .Commit }}
      - -X github.com/Nathandela/swarm/internal/version.Date={{ .Date }}

# Fuse the two darwin single-arch builds into one Mach-O universal (fat) binary
# so a single download runs natively on both Apple Silicon and Intel Macs — the
# artifact the homebrew cask points at. `replace: true` drops the darwin/amd64 and
# darwin/arm64 single-arch binaries from the release, leaving exactly: one darwin
# universal + linux/amd64 + linux/arm64. Reusing id `swarm` keeps the downstream
# `ids: [swarm]` filters (archives, homebrew_casks) matching all three. Linux
# artifacts are untouched.
universal_binaries:
  - id: swarm
    ids:
      - swarm
    replace: true
    name_template: swarm

  # swarm-remote MUST get the same treatment, and the reason is the archive below,
  # not symmetry. That archive carries BOTH binaries, and `replace: true` above
  # deletes the darwin single-arch `swarm` builds -- so without this block the
  # darwin_all archive would hold one binary (swarm) while the linux archives hold
  # two, which goreleaser rejects outright: "archive has different count of binaries
  # for each platform". The two lines met for the first time in the 2026-08-02 merge
  # (universal binaries came from the v0.4.0 Rosetta fix on main, the second binary
  # from the remote-control line) and neither was wrong on its own.
  - id: swarm-remote
    ids:
      - swarm-remote
    replace: true
    name_template: swarm-remote

archives:
  - id: swarm
    ids:
      - swarm
      - swarm-remote
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # files REPLACES the default include globs, so README.md is restated
    # alongside the compatibility card the before hook emitted.
    files:
      - README.md
      - compat.json

  - id: swarm-relay
    ids:
      - swarm-relay
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-relay_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# The release signs its checksums (lifecycle R2): checksums.txt.sig is base64 of
# a raw ed25519 signature over checksums.txt, produced by scripts/signchecksums
# from the SWARM_RELEASE_SIGNING_KEY secret (release.yml exports it) and
# verified on every machine by internal/upgrade.VerifyChecksums before anything
# from a release archive is trusted. sha256 alone only proves the tarball
# matches a checksums file fetched from the SAME origin; the signature is what
# binds both to the release pipeline.
signs:
  - id: checksums-ed25519
    artifacts: checksum
    cmd: go
    args: ["run", "./scripts/signchecksums", "--in", "${artifact}", "--out", "${signature}"]
    signature: "${artifact}.sig"

# Homebrew tap (E13.3), via the current (non-deprecated) `homebrew_casks`
# config — goreleaser deprecated the older `brews:` Formula pipe in favor of
# this one; a plain CLI binary (no .app bundle) works the same way, just via a
# `binary "swarm"` stanza instead of a hand-written `install`/`test` block. A
# snapshot/dry-run build (--skip=publish, what CI runs) DOES generate the cask
# file locally (dist/homebrew/Casks/swarm.rb) — it only skips PUSHING it to
# the tap repo, which needs a GITHUB_TOKEN. The tap repo itself
# (Nathandela/homebrew-swarm) is not created by this config; see
# packaging/homebrew/swarm.rb for an example of the formula this generates
# (captured from a real `goreleaser release --snapshot --clean --skip=publish`
# run, not hand-written), committed for reference.
homebrew_casks:
  - name: swarm
    ids:
      - swarm
    # A cask LINKS onto PATH only what it declares here; anything else in the archive
    # is staged under the Caskroom and never linked. Left at the default this emitted
    # `binary "swarm"` alone, so every Homebrew machine had a swarm that could not
    # resolve its gateway -- `swarm remote init` installed no unit and `swarm remote
    # pair` then advised re-running init, advice that could never succeed. This list
    # must name every binary the `swarm` archive above collects (asserted by
    # TestGoreleaser_CaskLinksEveryBinaryItsArchiveShips).
    binaries:
      - swarm
      - swarm-remote
    repository:
      owner: Nathandela
      name: homebrew-swarm
      # CI's GITHUB_TOKEN is scoped to the triggering repo only; pushing the cask
      # to the tap repo needs the fine-grained PAT stored as this repo secret
      # (Contents: read-write on homebrew-swarm alone). release.yml passes it in.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Nathandela/swarm"
    description: "Every coding agent on your machine, in one keyboard-driven terminal view"
    # F1: swarm is unsigned/unnotarized. Homebrew preserves the
    # com.apple.quarantine xattr from download onto the staged binaries, so
    # macOS Gatekeeper blocks the first run ("cannot be opened because the
    # developer cannot be verified" / "is damaged"). This is the standard,
    # documented fix for unsigned cask binaries: strip quarantine in postflight
    # before the user ever runs it. The whole staged path is stripped, not one
    # named binary: this archive also carries swarm-remote, which launchd
    # execs with no user present to click through a Gatekeeper prompt.
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path]
