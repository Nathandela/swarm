[package]
name = "swarm"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
sha2 = "0.10"
subtle = "2.6"
libc = "0.2"
vt100 = "0.18.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
hmac = "0.12"
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-always"] }
bbolt-rs = { version = "=1.3.10", features = ["compat"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
