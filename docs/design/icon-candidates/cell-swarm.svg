<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!--
    CANDIDATE 4 - "Cell Swarm"

    The swarm as multiplicity rather than motion: the cursor is three terminal cells of different
    sizes, scattered off the baseline instead of one underscore.

    Revised 2026-08-02 to the owner's third direction: SHARP. This candidate was always the blocky
    one - flat caps, square cells - so the change is the mitred joins and the thinner stroke, which
    put the zigzag in the same weight class as the cells it sits beside.

    This is the candidate that bets the most on small detail, which is exactly the bet the 48dp
    test is there to settle.

    Tokens: mark p-hero #53CE7C, ground p-bg #08090A (internal/design/tokens.json; the token names carry a leading
    double hyphen, elided here because XML forbids that sequence inside a comment).
    Adaptive mapping: the group below is the foreground layer, p-bg is the background layer.
    Safe zone: max r = 32.3 against the 33 the launcher mask guarantees, MEASURED from rendered
    pixels rather than derived. The hand-derived figure here said 28.7 and was wrong: a mitred
    join reaches past the path's own end, so the arithmetic that ignores it understates every
    corner. Re-measure rather than re-derive if these are ever tightened.
  -->
  <rect id="bg" width="108" height="108" fill="#08090A"/>
  <g id="fg">
    <path d="M 56 38 L 34 48.7 L 56 59.3 L 34 70"
          fill="none" stroke="#53CE7C" stroke-width="6" stroke-linecap="butt" stroke-linejoin="miter"/>
    <!-- Three cells, never closer than 4.5 units, which is the smallest gap that still shows at 48dp. -->
    <g fill="#53CE7C">
      <rect x="60" y="66" width="8" height="8"/>
      <rect x="72.5" y="56" width="7" height="7"/>
      <rect x="72.5" y="68" width="6.5" height="6.5"/>
    </g>
  </g>
</svg>
