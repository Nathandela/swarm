<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!--
    CANDIDATE 5 - "Green Tile"

    The only candidate with a container. The tile is hero green and the mark is knocked out of it in
    hero ink, which inverts the figure/ground of every other candidate and buys the most contrast
    available from the palette at small sizes.

    Revised 2026-08-02 to the owner's third direction: SHARP. Butt caps, mitred joins, a thinner
    stroke (7, down from 9) and a tighter corner radius on the standalone tile. Ink knocked out of
    green still carries more than green on near-black, so this stays the heaviest of the thin
    candidates - but it is now cut rather than drawn.

    The rounded square here is only so the shape is legible standing alone; on device the launcher
    supplies the mask, so the real implementation is a flat hero-green background layer with the
    ink group as the foreground.

    The cursor is a STRAIGHT bar on the S's own baseline (owner direction, 2026-08-03).

    Tokens: tile p-hero #53CE7C, mark p-hero-ink #06150C (internal/design/tokens.json; the token names carry a leading
    double hyphen, elided here because XML forbids that sequence inside a comment).
    Adaptive mapping: the group below is the foreground layer, p-hero is the background layer.
    Safe zone: max r = 28.1 against the 33 the launcher mask guarantees, MEASURED from rendered
    pixels rather than derived. The hand-derived figure here said 29.1 and was wrong: a mitred
    join reaches past the path's own end, so the arithmetic that ignores it understates every
    corner. Re-measure rather than re-derive if these are ever tightened.
  -->
  <rect id="bg" width="108" height="108" rx="16" fill="#53CE7C"/>
  <g id="fg" fill="none" stroke="#06150C" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M 56 36 L 34 48 L 56 60 L 34 72"/>
    <path d="M 60 72 L 78 72"/>
  </g>
</svg>
