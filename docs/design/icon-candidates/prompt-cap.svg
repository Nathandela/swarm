<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!--
    CANDIDATE 1 - "Prompt Cap"

    The literal reading of the brief. Revised 2026-08-02 to the owner's third direction: SHARP, not
    rounded. Every cap is a flat butt cut and every join is mitred, so the diagonal terminals come
    off at a blade angle and the zigzag's corners are points rather than beads. The stroke is thin
    (6 units, down from 7.5) to match the weight of a monospaced `>` rather than a drawn letter.

    The cap is the chevron's bottom stroke repeated, and the whole three-leg zigzag sits in the
    y 38-70 box the original `>` occupied alone, so the S kept the prompt's proportions.

    The cursor is the wiggle made SQUARE: one bar with a single step in it, mitred, which is what a
    terminal cursor mid-blink looks like rather than what a brush stroke looks like.

    Tokens: mark p-hero #53CE7C, ground p-bg #08090A (internal/design/tokens.json; the token names carry a leading
    double hyphen, elided here because XML forbids that sequence inside a comment).
    Adaptive mapping: the group below is the foreground layer, p-bg is the background layer.
    Safe zone: all geometry including stroke sits inside the 66dp centre circle (max r = 29.5).
  -->
  <rect id="bg" width="108" height="108" fill="#08090A"/>
  <g id="fg" fill="none" stroke="#53CE7C" stroke-width="6" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M 57 38 L 34 48.7 L 57 59.3 L 34 70"/>
    <path d="M 59 73 L 67 73 L 67 67 L 77 67"/>
  </g>
</svg>
