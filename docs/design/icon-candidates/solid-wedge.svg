<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!--
    CANDIDATE 3 - "Solid Wedge"

    The S-dominant end of the spectrum: the same zigzag carried at the heaviest weight the set
    allows, so mass rather than detail is what survives downscaling.

    Revised 2026-08-02 to the owner's third direction: SHARP. Mitred joins give the reversals real
    points, butt caps cut both terminals flat at the diagonal's own angle, and the weight came down
    from 10 to 8.5 - enough that the three legs keep an open channel between them at 48dp instead
    of fusing into a slab. The box grew slightly (y 36-72) for the same reason.

    The cursor is a STRAIGHT solid bar on the S's own baseline (owner direction, 2026-08-03),
    and it is the one filled shape here, which is what keeps it reading as a cursor beside a
    stroked letter without needing a step to distinguish it.

    Tokens: mark p-hero #53CE7C, ground p-bg #08090A (internal/design/tokens.json; the token names carry a leading
    double hyphen, elided here because XML forbids that sequence inside a comment).
    Adaptive mapping: the group below is the foreground layer, p-bg is the background layer.
    Safe zone: max r = 31.97 against the 33 the launcher mask guarantees, MEASURED from rendered
    pixels (rsvg-convert at 1080, mark pixels only; furthest point is the cursor bar's bottom-right
    corner at 76.9, 76.2). Re-measure rather than re-derive if this is ever touched: THREE figures
    here have now been wrong, each for a different reason. The hand-derived 30.3 ignored what a
    mitred join does past the path's own end. The 32.5 that replaced it was measured correctly but
    on the STEPPED cursor, and the straight bar of 2026-08-03 moved the corner out without anyone
    re-measuring: 34.2, past the guarantee, in a file whose own comment says to measure. The
    cursor is 16 wide from x 61 rather than 18 from x 62 for exactly that reason; it costs two
    units of a bar nobody measures by eye and buys back the margin.
  -->
  <rect id="bg" width="108" height="108" fill="#08090A"/>
  <g id="fg">
    <path d="M 57 36 L 34 48 L 57 60 L 34 72"
          fill="none" stroke="#53CE7C" stroke-width="8.5" stroke-linecap="butt" stroke-linejoin="miter"/>
    <!-- The cursor: one straight bar, on the zigzag's own baseline. -->
    <rect x="61" y="67.75" width="16" height="8.5" fill="#53CE7C"/>
  </g>
</svg>
