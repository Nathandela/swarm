<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!--
    CANDIDATE 2 - "Trail"

    The prompt-dominant end of the spectrum, reached by weight rather than by geometry: the chevron
    is the heaviest stroke and its cap the lightest - the same diagonal, echoed thinner above - so
    the eye lands on the `>` first and the S assembles a beat later.

    Revised 2026-08-02 to the owner's third direction: SHARP throughout. Butt caps and mitred joins
    were already this candidate's register (it was the flat-cut one); what changed is that the last
    rounded join on the chevron is now a point, and every weight came down.

    The cursor is a block and one shorter echo - the swarm as motion rather than as multiplicity -
    and it shares the chevron's weight, which is what pairs them as `>_`.

    Tokens: mark p-hero #53CE7C, ground p-bg #08090A (internal/design/tokens.json; the token names carry a leading
    double hyphen, elided here because XML forbids that sequence inside a comment).
    Adaptive mapping: the group below is the foreground layer, p-bg is the background layer.
    Safe zone: max r = 30.9 against the 33 the launcher mask guarantees, MEASURED from rendered
    pixels rather than derived. The hand-derived figure here said 28.3 and was wrong: a mitred
    join reaches past the path's own end, so the arithmetic that ignores it understates every
    corner. Re-measure rather than re-derive if these are ever tightened.
  -->
  <rect id="bg" width="108" height="108" fill="#08090A"/>
  <g id="fg" fill="none" stroke="#53CE7C" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- The chevron's bottom stroke, repeated above in the lightest weight. -->
    <path d="M 57 38 L 34 48.7" stroke-width="4.5"/>
    <!-- The chevron and the cursor share the heaviest weight. -->
    <path d="M 34 48.7 L 57 59.3 L 34 70" stroke-width="7"/>
    <path d="M 59 70 L 69 70" stroke-width="7"/>
    <path d="M 73 70 L 78 70" stroke-width="7"/>
  </g>
</svg>
