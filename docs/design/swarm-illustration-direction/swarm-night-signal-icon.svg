      <stop offset="0" stop-color="#8eb4e6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#1b2334" stop-opacity=".88"/>
    </radialGradient>
    <filter id="signal" x="-300%" y="-300%" width="700%" height="700%">
