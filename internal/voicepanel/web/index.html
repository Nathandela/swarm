<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Swarm Voice Manager</title>
  <link rel="stylesheet" href="/slate.css">
  <link rel="stylesheet" href="/panel.css">
  <script src="/panel.js" defer></script>
</head>
<body>
  <main>
    <header><p class="brand">Swarm</p><h1>Voice manager</h1><p id="connection" role="status">Connecting…</p></header>
    <section aria-labelledby="request-title">
      <h2 id="request-title">Send a request</h2>
      <form id="text-form">
        <label for="request">Message</label>
        <textarea id="request" rows="4" maxlength="16384" required></textarea>
        <div class="controls">
          <button id="send" type="submit" disabled>Send message</button>
          <button id="mic" type="button" disabled>Start recording</button>
        </div>
      </form>
      <p id="notice" role="status"></p>
    </section>
    <section aria-labelledby="result-title">
      <h2 id="result-title">Manager updates</h2>
      <div class="controls">
        <label for="history">Request</label>
        <select id="history" disabled></select>
        <button id="retry" type="button" hidden>Retry same message</button>
        <button id="dismiss" type="button" disabled>Dismiss from this tab</button>
      </div>
      <p id="receipt" role="status"></p>
      <div class="controls" id="preview" hidden>
        <button type="button" id="stop-preview">Stop reading</button>
        <label for="audio-progress">Audio progress</label>
        <progress id="audio-progress" value="0" max="1"></progress>
      </div>
      <p id="preview-status" role="status"></p>
      <ol id="publications" aria-live="polite"></ol>
    </section>
  </main>
</body>
</html>
